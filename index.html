<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcadeZone</title>
    <!-- Tailwind CSS (via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0A0A0A;
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }
        /* Estilos base para scrollbar e seleção (opcionais, semelhantes ao React) */
        ::selection { background: rgba(123, 178, 203, 0.4); }
        .hidden { display: none !important; }
        .toast {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 50;
            padding: 1rem;
            border-radius: 0.5rem;
            background-color: #1a1a1a;
            border: 1px solid #333;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transform: translateX(150%);
            transition: transform 0.3s ease-in-out;
        }
        .toast.show { transform: translateX(0); }
        .toast-success { border-left: 4px solid #10B981; }
        .toast-error { border-left: 4px solid #EF4444; }
    </style>
</head>
<body class="min-h-screen relative overflow-x-hidden">

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <span id="toast-message">Mensagem</span>
    </div>

    <!-- Layout Principal (Mobile First) -->
    <div class="flex flex-col min-h-screen pb-20">
        
        <!-- Header -->
        <header class="p-6 text-center border-b border-zinc-800/50 bg-black/50 sticky top-0 z-10">
            <h1 class="text-3xl font-black tracking-tighter">ARCADE<span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">ZONE</span></h1>
            <p class="text-zinc-400 text-sm mt-1 uppercase tracking-widest">Eat. Play. Repeat.</p>
        </header>

        <!-- Container de Conteúdo -->
        <main class="flex-1 overflow-y-auto p-4 md:p-6" id="main-content">
            <!-- As abas serão injetadas aqui pelo JS -->
        </main>

        <!-- Navegação Inferior -->
        <nav class="fixed bottom-0 w-full bg-black border-t border-zinc-800/80 px-2 py-3 z-20">
            <div class="flex justify-around max-w-md mx-auto relative">
                <button onclick="changeTab('menu')" id="nav-menu" class="nav-btn flex flex-col items-center p-2 rounded-xl transition-all w-16 opacity-50 hover:opacity-100 text-blue-400">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    <span class="text-[10px] font-bold">Menu</span>
                </button>
                <button onclick="changeTab('lan')" id="nav-lan" class="nav-btn flex flex-col items-center p-2 rounded-xl transition-all w-16 opacity-50 hover:opacity-100 text-purple-400">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    <span class="text-[10px] font-bold">Lan</span>
                </button>
                <button onclick="changeTab('arcade')" id="nav-arcade" class="nav-btn flex flex-col items-center p-2 rounded-xl transition-all w-16 opacity-50 hover:opacity-100 text-yellow-400">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span class="text-[10px] font-bold">Arcade</span>
                </button>
                <button onclick="changeTab('cart')" id="nav-cart" class="nav-btn flex flex-col items-center p-2 rounded-xl transition-all w-16 opacity-50 hover:opacity-100 text-green-400 relative">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    <span class="text-[10px] font-bold">Carrinho</span>
                    <span id="cart-badge" class="hidden absolute top-1 right-2 bg-red-500 text-white text-[10px] font-bold h-4 w-4 rounded-full flex items-center justify-center border border-black shadow-md">0</span>
                </button>
            </div>
        </nav>
    </div>

    <!-- Templates das Abas (Ocultos) -->
    <div id="templates" class="hidden">
        
        <!-- Aba: Menu -->
        <div id="tpl-menu" class="space-y-6">
            <h2 class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300 uppercase tracking-widest text-center">
                Destrave seu Sabor
            </h2>
            <div id="menu-items" class="space-y-4"></div>
        </div>

        <!-- Aba: Lan House -->
        <div id="tpl-lan" class="space-y-6">
            <div class="text-center space-y-2">
                <h2 class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500 uppercase tracking-widest">Lan House</h2>
                <p class="text-zinc-400 text-sm">Escolha seu setup e domine o jogo.</p>
            </div>
            
            <div class="space-y-3">
                <h3 class="text-sm font-bold text-zinc-300 uppercase">1. Selecione a Máquina</h3>
                <div class="grid grid-cols-2 gap-3" id="lan-pcs">
                    <button class="pc-btn bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-sm font-bold text-zinc-300 hover:border-purple-500/50 hover:bg-purple-900/10 transition-colors text-center" data-pc="PC 01 Pro">PC 01 Pro</button>
                    <button class="pc-btn bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-sm font-bold text-zinc-300 hover:border-purple-500/50 hover:bg-purple-900/10 transition-colors text-center" data-pc="PC 02 Pro">PC 02 Pro</button>
                    <button class="pc-btn bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-sm font-bold text-zinc-300 hover:border-purple-500/50 hover:bg-purple-900/10 transition-colors text-center" data-pc="PC 03 Standard">PC 03 Standard</button>
                    <button class="pc-btn bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-sm font-bold text-zinc-300 hover:border-purple-500/50 hover:bg-purple-900/10 transition-colors text-center" data-pc="PC 04 Standard">PC 04 Standard</button>
                </div>
            </div>

            <div class="space-y-3 mt-6">
                <h3 class="text-sm font-bold text-zinc-300 uppercase">2. Selecione o Horário</h3>
                <div class="flex flex-wrap gap-2" id="lan-times">
                    <button class="time-btn bg-zinc-900 border border-zinc-800 py-2 px-4 rounded-full text-sm font-medium text-zinc-300 hover:border-purple-500/50 hover:bg-purple-900/10 transition-colors" data-time="14:00">14:00</button>
                    <button class="time-btn bg-zinc-900 border border-zinc-800 py-2 px-4 rounded-full text-sm font-medium text-zinc-300 hover:border-purple-500/50 hover:bg-purple-900/10 transition-colors" data-time="15:00">15:00</button>
                    <button class="time-btn bg-zinc-900 border border-zinc-800 py-2 px-4 rounded-full text-sm font-medium text-zinc-300 hover:border-purple-500/50 hover:bg-purple-900/10 transition-colors" data-time="16:00">16:00</button>
                    <button class="time-btn bg-zinc-900 border border-zinc-800 py-2 px-4 rounded-full text-sm font-medium text-zinc-300 hover:border-purple-500/50 hover:bg-purple-900/10 transition-colors" data-time="18:00">18:00</button>
                    <button class="time-btn bg-zinc-900 border border-zinc-800 py-2 px-4 rounded-full text-sm font-medium text-zinc-300 hover:border-purple-500/50 hover:bg-purple-900/10 transition-colors" data-time="20:00">20:00</button>
                </div>
            </div>

            <button onclick="confirmLanReservation()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold py-4 rounded-xl mt-6 shadow-[0_0_20px_rgba(168,85,247,0.3)] transition-all">
                CONFIRMAR RESERVA
            </button>
        </div>

        <!-- Aba: Arcade -->
        <div id="tpl-arcade" class="space-y-6">
            <div class="text-center bg-zinc-900/50 border border-zinc-800/50 rounded-2xl p-6 shadow-inner relative overflow-hidden">
                <div class="absolute inset-0 bg-yellow-500/5 blur-2xl"></div>
                <h2 class="text-zinc-400 font-bold uppercase tracking-wider text-sm mb-2">Saldo de Fichas</h2>
                <div class="text-5xl font-black text-yellow-400 drop-shadow-[0_0_15px_rgba(250,204,21,0.4)]" id="arcade-balance">0</div>
                <p class="text-zinc-500 text-xs mt-2">Pronto para jogar</p>
            </div>

            <div class="space-y-4 mt-8">
                <h3 class="text-sm font-bold text-zinc-300 uppercase mb-4">Recarregar Fichas</h3>
                <div id="arcade-packages" class="space-y-3">
                    <!-- Pacotes injetados via JS -->
                </div>
            </div>
        </div>

        <!-- Aba: Carrinho -->
        <div id="tpl-cart" class="space-y-6">
            <h2 class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-500 uppercase tracking-widest text-center">
                Carrinho
            </h2>
            <div id="cart-content">
                <!-- Carrinho vazio ou itens injetados via JS -->
            </div>
        </div>

    </div>

    <!-- Lógica JavaScript (Vanilla) -->
    <script>
        // --- ESTADO DA APLICAÇÃO ---
        let currentTab = 'menu';
        let cart = [];
        let tokens = 0;
        let lanSelection = { pc: null, time: null };

        // --- DADOS ---
        const menuData = [
            { id: 1, name: "Combo Power Up", desc: "Burguer Duplo + Fritas + Refri", price: 35.90, icon: "🍔" },
            { id: 2, name: "Mascote Box", desc: "Acompanha o Mascote de Cristal Roxo exclusivo!", price: 49.90, icon: "👾", highlight: true },
            { id: 3, name: "Neon Fries", desc: "Batatas rústicas com cheddar e bacon", price: 18.90, icon: "🍟" },
        ];

        const arcadePackages = [
            { qty: 10, price: 15.00, bonus: 0 },
            { qty: 25, price: 30.00, bonus: 2 },
            { qty: 50, price: 50.00, bonus: 10, highlight: true },
        ];

        // --- FUNÇÕES UTILITÁRIAS ---
        function formatPrice(price) {
            return price.toFixed(2).replace('.', ',');
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const messageEl = document.getElementById('toast-message');
            
            toast.className = `toast toast-${type} show`;
            messageEl.textContent = msg;

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function updateCartBadge() {
            const badge = document.getElementById('cart-badge');
            if (cart.length > 0) {
                badge.textContent = cart.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // --- NAVEGAÇÃO E RENDERIZAÇÃO ---
        function changeTab(tabName) {
            currentTab = tabName;
            const mainContent = document.getElementById('main-content');
            const template = document.getElementById(`tpl-${tabName}`).cloneNode(true);
            template.id = ''; // Remove ID do clone para evitar duplicatas

            mainContent.innerHTML = '';
            mainContent.appendChild(template);

            // Atualiza botões de navegação (Opacidade)
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.replace('opacity-100', 'opacity-50'));
            document.getElementById(`nav-${tabName}`).classList.replace('opacity-50', 'opacity-100');

            // Chamadas específicas para cada aba
            if (tabName === 'menu') renderMenu();
            if (tabName === 'cart') renderCart();
            if (tabName === 'arcade') renderArcade();
            if (tabName === 'lan') attachLanEvents();
        }

        // --- ABA: MENU ---
        function renderMenu() {
            const container = document.querySelector('#main-content #menu-items');
            if (!container) return;

            menuData.forEach(item => {
                const isHighlight = item.highlight ? 'border-blue-500 shadow-[0_0_15px_rgba(59,130,246,0.2)]' : 'border-zinc-800 hover:border-zinc-700';
                const bgClass = item.highlight ? 'bg-gradient-to-r from-blue-900/20 to-transparent' : 'bg-zinc-900/50';
                
                const itemHTML = `
                    <div class="flex flex-col p-4 rounded-2xl border ${isHighlight} ${bgClass} transition-all group">
                        <div class="flex items-start justify-between mb-3">
                            <div class="flex items-center gap-3">
                                <div class="w-12 h-12 rounded-xl bg-zinc-800 flex items-center justify-center text-2xl shadow-inner border border-zinc-700/50 group-hover:scale-110 transition-transform">
                                    ${item.icon}
                                </div>
                                <div>
                                    <h3 class="font-bold text-zinc-100">${item.name}</h3>
                                    <p class="text-xs text-zinc-400 line-clamp-2 pr-2">${item.desc}</p>
                                    <div class="text-blue-400 font-black mt-1">
                                        R$ ${formatPrice(item.price)}
                                    </div>
                                </div>
                            </div>
                        </div>
                        <button onclick="addToCart(${item.id})" class="w-full bg-zinc-800 hover:bg-blue-600 text-white font-bold py-2 rounded-xl text-sm transition-colors mt-2">
                            ADICIONAR
                        </button>
                    </div>
                `;
                container.innerHTML += itemHTML;
            });
        }

        function addToCart(itemId) {
            const item = menuData.find(i => i.id === itemId);
            if (item) {
                cart.push({ ...item, cartId: Date.now() + Math.random() });
                updateCartBadge();
                showToast(`${item.name} adicionado ao carrinho!`);
            }
        }

        // --- ABA: LAN HOUSE ---
        function attachLanEvents() {
            const mainContent = document.getElementById('main-content');
            
            // Lógica de seleção de PC
            const pcBtns = mainContent.querySelectorAll('.pc-btn');
            pcBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    pcBtns.forEach(b => {
                        b.classList.remove('border-purple-500', 'bg-purple-900/20', 'text-purple-400');
                        b.classList.add('border-zinc-800', 'text-zinc-300');
                    });
                    const target = e.target;
                    target.classList.remove('border-zinc-800', 'text-zinc-300');
                    target.classList.add('border-purple-500', 'bg-purple-900/20', 'text-purple-400');
                    lanSelection.pc = target.dataset.pc;
                });
            });

            // Lógica de seleção de Horário
            const timeBtns = mainContent.querySelectorAll('.time-btn');
            timeBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    timeBtns.forEach(b => {
                        b.classList.remove('border-purple-500', 'bg-purple-900/20', 'text-purple-400');
                        b.classList.add('border-zinc-800', 'text-zinc-300');
                    });
                    const target = e.target;
                    target.classList.remove('border-zinc-800', 'text-zinc-300');
                    target.classList.add('border-purple-500', 'bg-purple-900/20', 'text-purple-400');
                    lanSelection.time = target.dataset.time;
                });
            });
        }

        function confirmLanReservation() {
            if (!lanSelection.pc || !lanSelection.time) {
                showToast('Selecione uma máquina e um horário!', 'error');
                return;
            }
            showToast(`Reserva confirmada: ${lanSelection.pc} às ${lanSelection.time}!`);
            
            // Reseta seleções
            lanSelection = { pc: null, time: null };
            // Re-renderiza para limpar visualmente
            changeTab('lan'); 
        }

        // --- ABA: ARCADE ---
        function renderArcade() {
            const container = document.querySelector('#main-content #arcade-packages');
            if (!container) return;

            // Atualiza saldo
            document.querySelector('#main-content #arcade-balance').textContent = tokens;

            arcadePackages.forEach((pkg, index) => {
                const isHighlight = pkg.highlight ? 'border-yellow-500 shadow-[0_0_15px_rgba(234,179,8,0.2)] bg-gradient-to-r from-yellow-900/20 to-transparent' : 'border-zinc-800 bg-zinc-900/50';
                
                const html = `
                    <div class="flex items-center justify-between p-4 rounded-2xl border ${isHighlight}">
                        <div>
                            <div class="flex items-baseline gap-1">
                                <span class="text-2xl font-black text-zinc-100">${pkg.qty}</span>
                                <span class="text-zinc-400 font-bold text-sm">Fichas</span>
                            </div>
                            ${pkg.bonus > 0 ? `<div class="text-xs font-bold text-yellow-400 mt-1 uppercase tracking-wide">+ ${pkg.bonus} Fichas Grátis!</div>` : ''}
                        </div>
                        <button onclick="buyTokens(${index})" class="bg-zinc-800 hover:bg-yellow-500 hover:text-black text-white font-bold py-2 px-4 rounded-xl text-sm transition-colors border border-zinc-700 hover:border-yellow-400">
                            R$ ${formatPrice(pkg.price)}
                        </button>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function buyTokens(index) {
            const pkg = arcadePackages[index];
            const totalGained = pkg.qty + pkg.bonus;
            tokens += totalGained;
            showToast(`+${totalGained} fichas adicionadas à sua conta!`);
            // Atualiza saldo visualmente na hora
            const balanceEl = document.querySelector('#main-content #arcade-balance');
            if(balanceEl) balanceEl.textContent = tokens;
        }

        // --- ABA: CARRINHO ---
        function renderCart() {
            const container = document.querySelector('#main-content #cart-content');
            if (!container) return;

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-zinc-500">
                        <div class="text-4xl mb-4 opacity-50">🛒</div>
                        <p>Seu carrinho está vazio.</p>
                        <p class="text-sm mt-2">Bora destravar um combo?</p>
                    </div>
                `;
                return;
            }

            let total = 0;
            let itemsHTML = '<div class="space-y-3 mb-6">';

            cart.forEach(item => {
                total += item.price;
                itemsHTML += `
                    <div class="flex items-center justify-between p-4 rounded-2xl bg-zinc-900 border border-zinc-800">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl">${item.icon}</span>
                            <div>
                                <h4 class="font-bold text-sm text-zinc-100">${item.name}</h4>
                                <div class="text-green-400 text-xs font-bold mt-1">R$ ${formatPrice(item.price)}</div>
                            </div>
                        </div>
                        <button onclick="removeFromCart(${item.cartId})" class="p-2 text-zinc-500 hover:text-red-400 hover:bg-red-400/10 rounded-lg transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                `;
            });
            itemsHTML += '</div>';

            const summaryHTML = `
                <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-xl">
                    <div class="flex justify-between items-center text-zinc-100 mb-6">
                        <span class="text-sm font-bold uppercase text-zinc-400">Total</span>
                        <span class="text-2xl font-black text-green-400">R$ ${formatPrice(total)}</span>
                    </div>
                    <button onclick="checkout()" class="w-full bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-400 hover:to-emerald-500 text-white font-bold py-4 rounded-xl shadow-[0_0_20px_rgba(16,185,129,0.3)] transition-all uppercase tracking-widest text-sm">
                        Finalizar Pedido
                    </button>
                </div>
            `;

            container.innerHTML = itemsHTML + summaryHTML;
        }

        function removeFromCart(cartId) {
            cart = cart.filter(item => item.cartId !== cartId);
            updateCartBadge();
            renderCart(); // Re-renderiza a aba carrinho
        }

        function checkout() {
            if (cart.length === 0) return;
            showToast('Pedido finalizado com sucesso! Preparando seus itens...');
            cart = [];
            updateCartBadge();
            renderCart();
        }

        // --- INICIALIZAÇÃO ---
        // Inicia na aba Menu quando a página carrega
        window.onload = () => {
            changeTab('menu');
        };
    </script>
</body>
</html>
